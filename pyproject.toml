[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptfw"
version = "0.1.0"
description = "LLM prompt injection firewall: provenance fencing, tool authorization and egress control around an untrusted model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nassim Hsaine" }]
keywords = ["llm", "security", "prompt-injection", "firewall", "ai-security", "owasp-llm"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
promptfw = "promptfw.cli:main"

[tool.setuptools.packages.find]
include = ["promptfw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E731"]
