# promptfw policy. Copy, edit, and pass with --policy or PROMPTFW_POLICY.
id: my-app

# Layers to run. Remove one to see what it was doing (verdicts record "layer-disabled").
layers: [normalize, ingress, provenance, toolauth, egress]

# Scored findings (ingress, normalize, secrets, PII) are combined with a noisy-OR.
# Invariant findings (nonce forgery, tainted tool call, canary leak, unknown URL) always block.
block_threshold: 0.6
user_ingress_factor: 0.7   # USER spans weigh less than DATA spans: a user may give instructions
strict_data: false         # true = any ingress finding in DATA becomes a hard block
disabled_rules: []         # e.g. [IN-003] if it is noisy on your documents

# Egress
canaries: [VANTAGE-7731-ORION]          # secrets that must never leave, in any encoding (>= 8 alnum chars)
allowed_hosts: [vantage-logistics.example]  # suffix match: covers sub-domains
enforce_url_allowlist: true
detect_secrets: true
detect_pii: true

# Tools: the model requests, the firewall authorizes. Unknown tools are refused (fail closed).
forbidden_effects: [delete]
tools:
  - name: lookup_order
    effects: [read]
    args: {order_id: str}
    required: [order_id]
  - name: send_email
    effects: [send]
    guards: [no_untrusted_influence]   # refused once a DATA span entered the context
    args: {to: str, body: str}
    required: [to, body]
  - name: refund
    effects: [spend]
    guards: [user_confirmed]
    args: {order_id: str, amount: float}
    required: [order_id, amount]
  # Account-scoped action: the target account must be the authenticated user's (anti-BOLA).
  # This is the check that was missing in the Meta AI / Instagram takeovers of May 2026.
  # In proxy mode the identity comes from the X-PromptFW-Principal header, set by YOUR backend.
  - name: change_recovery_email
    effects: [write]
    guards: [args_bound_to_session, user_confirmed]
    args: {account: str, email: str}
    required: [account, email]
    bound_args: [account]

# Resource limits (anti-DoS). Oversized inputs are refused before inspection (fail closed).
max_span_chars: 50000
max_total_chars: 200000
max_output_chars: 50000

# Proxy: non-text parts (images, audio, files) cannot be inspected by text rules.
#   block_untrusted: refused inside tool results, recorded elsewhere (default)
#   block: refused everywhere | allow: recorded only
non_text_content: block_untrusted

# Authorization (see README section 7.2). Uncomment and adapt.
# roles:
#   support_agent: [refunds:create]
# origin_trust:
#   kb: trusted                 # undeclared channels are untrusted
# assistant_after_data: user     # "data": stricter reading of assistant turns after untrusted content
