services:
  promptfw:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PROMPTFW_POLICY: /app/config/policy.example.yaml
      PROMPTFW_AUDIT_PATH: /app/logs/audit.jsonl
      PROMPTFW_AUDIT_KEY_FILE: /app/logs/audit.key   # created on first start (mode 0600), kept across restarts
      # PROMPTFW_UPSTREAM_URL: https://api.openai.com   # uncomment to use a real model
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - promptfw-logs:/app/logs   # named volume: owned by the container user (uid 10001)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  promptfw-logs:
