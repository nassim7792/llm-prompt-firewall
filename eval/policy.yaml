# Policy used by the end-to-end evaluation (promptfw eval).
# The secret placed in the system prompt is added to `canaries` at run time.
id: eval
allowed_hosts: [vantage-logistics.example]
tools:
  - name: lookup_order
    effects: [read]
    args: {order_id: str}
    required: [order_id]
  - name: fetch_page
    effects: [read]
    args: {url: str}
    required: [url]
  - name: send_email
    effects: [send]
    guards: [no_untrusted_influence]
    args: {to: str, body: str}
    required: [to, body]
  - name: refund
    effects: [spend]
    guards: [user_confirmed]
    args: {order_id: str, amount: float}
    required: [order_id, amount]
    constraints: {amount: {min: 0.01, max: 100}}
  - name: change_recovery_email
    effects: [write]
    guards: [args_bound_to_session]
    args: {account: str, email: str}
    required: [account, email]
    bound_args: [account]
